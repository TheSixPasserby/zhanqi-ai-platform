<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#146B57">
  <meta name="format-detection" content="telephone=no">
  <title>战旗云 · 游客端</title>
  <!--
    游客端只有这一套页面，靠 CSS 媒体查询自适应电脑与手机，不再有独立的「电脑版」目录。
    （历史背景：以前 /visitor/ 与 /visitor/pc/ 是两套 HTML+JS，功能与样式各改一遍，
      长期不同步；现在统一成一个入口，桌面端只是把同样的内容排得更宽。）
  -->
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/theme-dark.css">
  <link rel="stylesheet" href="../assets/css/theme-warm.css">
  <link rel="stylesheet" href="../assets/css/theme-ink.css">
  <link rel="stylesheet" href="../assets/css/virtual-map.css">
  <link rel="stylesheet" href="./css/visitor.css">
  <script src="../assets/js/theme.js"></script>
</head>
<body>
<div id="app" v-cloak>

  <!-- 全局提示放在最外层：登录页还没进入主界面时也要能弹提示，
       放在登录态判断里面会导致「注册/登录失败没有任何反馈」。 -->
  <div class="toast-wrap">
    <div class="toast" v-for="(t, i) in toasts" :key="i">{{ t }}</div>
  </div>

  <!-- 启动占位：首屏数据没回来之前先显示，避免出现白屏 -->
  <div v-if="!booted" class="boot">
    <div class="boot-mark">旗</div>
    <div class="boot-text">{{ site.shortName || '战旗云' }}</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <template v-else>
    <!--
      下面这一串是最外层视图切换，顺序不能乱，中间也不要插入注释：
      Vue 2 靠「前一个兄弟元素」来判断 v-else / v-else-if 属于哪个分支。
    -->
    <div v-if="view === 'connect'" class="screen">
      <header class="topbar">
        <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
        <div class="topbar-title"><h1>连接服务器</h1><p>填写服务端地址</p></div>
      </header>
      <div class="pad-x">
        <div class="card">
          <div class="card-title"><i></i>服务端地址</div>
          <p class="muted small">
            游客端默认与接口同源，正常访问不需要填这里。
            只有把本页单独部署到其它域名时才需要指定后端地址。
          </p>
          <input class="input" v-model.trim="baseUrlInput" placeholder="例如 http://192.168.1.10:8080">
          <div class="row gap mt">
            <button class="btn btn-ghost" @click="testConn">{{ testing ? '测试中…' : '测试连接' }}</button>
            <button class="btn" @click="saveConn">保存并使用</button>
          </div>
          <div v-if="connResult" class="alert" :class="connResult.ok ? 'alert-ok' : 'alert-bad'">
            {{ connResult.message }}
          </div>
        </div>
      </div>
    </div>

    <div v-else-if="!user" class="screen login-screen">
      <div class="login-hero">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="login-seal">旗</div>
        <h1>{{ site.shortName || '战旗云' }} · 游客端</h1>
        <p>{{ site.name || '郫都区战旗村 · 川西林盘农商文旅智慧服务平台' }}</p>
      </div>

      <div class="login-sheet">
        <div class="tabs">
          <div class="tab" :class="{ on: authTab === 'login' }" @click="authTab = 'login'">登录</div>
          <div class="tab" :class="{ on: authTab === 'register' }" @click="authTab = 'register'">注册新账号</div>
        </div>

        <!-- 登录 -->
        <template v-if="authTab === 'login'">
          <label class="field"><span>账号</span>
            <input class="input" v-model.trim="loginForm.account" placeholder="请输入账号" @keyup.enter="doLogin">
          </label>
          <label class="field"><span>密码</span>
            <input class="input" v-model="loginForm.password" type="password" placeholder="请输入密码" @keyup.enter="doLogin">
          </label>
          <button class="btn btn-block" :disabled="loading" @click="doLogin">{{ loading ? '登录中…' : '登 录' }}</button>

          <div class="login-links">
            <a @click="authTab = 'register'">没有账号？注册一个</a>
          </div>

          <div class="known">
            <div class="known-head">
              <strong>快捷登录</strong>
              <span class="dim" v-if="known.length">点卡片免密进入</span>
            </div>

            <div v-if="knownLoading" class="sk-list">
              <div class="sk-line"></div><div class="sk-line"></div>
            </div>

            <div v-else-if="!known.length" class="empty-box">
              <b>还没有可快捷登录的账号</b>
              <p>为了不泄露任何已有账号，这里只显示本机登录过的账号。先注册一个，或用账号密码登录一次。</p>
            </div>

            <div v-else class="known-list">
              <div class="known-card" v-for="(a, i) in known" :key="a.account"
                   :style="{ animationDelay: (i * 50) + 'ms' }" @click="doQuick(a)">
                <img class="known-avatar" :src="knownAvatar(a)" alt="">
                <div class="known-body">
                  <b>{{ a.name }}</b>
                  <span>{{ a.account }} · {{ a.lastLoginText || '最近登录过' }}</span>
                </div>
                <div class="known-go">进入 ›</div>
              </div>
            </div>
          </div>
        </template>

        <!-- 注册 -->
        <template v-else>
          <div class="notice">
            <i>i</i>
            <span>注册后即可下单、预约、打卡集章。</span>
          </div>
          <label class="field"><span>账号</span>
            <input class="input" v-model.trim="regForm.account" placeholder="字母开头，4-20 位字母数字下划线">
          </label>
          <label class="field"><span>昵称</span>
            <input class="input" v-model.trim="regForm.name" placeholder="怎么称呼你">
          </label>
          <label class="field"><span>手机号 <em>选填</em></span>
            <input class="input" v-model.trim="regForm.phone" inputmode="numeric" maxlength="11" placeholder="用于接收订单通知">
          </label>
          <label class="field"><span>密码</span>
            <input class="input" v-model="regForm.password" type="password" placeholder="至少 6 位">
          </label>
          <label class="field"><span>确认密码</span>
            <input class="input" v-model="regForm.confirm" type="password" placeholder="再输一次">
          </label>
          <button class="btn btn-block" :disabled="loading" @click="doRegister">{{ loading ? '注册中…' : '注 册' }}</button>
          <div class="login-links"><a @click="authTab = 'login'">已有账号？去登录</a></div>
        </template>
      </div>

      <div class="login-foot">登录即表示同意平台服务条款与隐私政策</div>
    </div>
    <div v-else class="screen app-screen">

      <!--
        桌面导航条：只在宽屏（≥900px）显示，手机由底部 tabbar 承担导航。
        这里的文字一律包在 <span> 里 —— 之前电脑版把文字写成裸文本节点，
        媒体查询想隐藏文字时选择器 .nav-links a span 完全匹配不到，
        宽度一窄八项加搜索框就挤压换行。
      -->
      <header class="topnav">
        <div class="nav-inner">
          <a class="nav-brand" @click="go('home', true)">
            <img class="brand-logo" src="../assets/img/logo.svg" alt="">
            <span class="brand-text">
              <b>{{ site.shortName || '战旗云' }}</b>
              <em>游客端</em>
            </span>
          </a>

          <nav class="nav-links">
            <a v-for="n in navLinks" :key="n.view" :title="n.text"
               :class="{ on: view === n.view }" @click="go(n.view, true)">
              <svg class="i" aria-hidden="true"><use :href="iconHref(n.icon)"></use></svg><span>{{ n.text }}</span>
            </a>
          </nav>

          <div class="nav-right">
            <div class="nav-search">
              <svg class="i" aria-hidden="true"><use :href="iconHref('i-search')"></use></svg>
              <input v-model.trim="keyword" placeholder="搜商品" @keyup.enter="go('shop', true); loadProducts()">
            </div>
            <button class="icon-btn" title="我的消息" @click="go('chatList', true)">
              <svg class="i" aria-hidden="true"><use :href="iconHref('i-mail')"></use></svg>
            </button>
            <button class="icon-btn" title="购物车" @click="openCart">
              <svg class="i" aria-hidden="true"><use :href="iconHref('i-cart')"></use></svg>
              <i v-if="cartCount" class="badge">{{ cartCount }}</i>
            </button>
            <div class="nav-user">
              <span class="avatar" @click="go('mine', true)">
                <img v-if="avatarUrl" :src="avatarUrl" alt="">
                <template v-else>{{ (user.name || '游').slice(0, 1) }}</template>
              </span>
              <!-- 头像悬浮菜单：与商户端/管理端保持同一套结构（图标 + 文字），
                   改密码只在「个人中心」里，不再放进悬浮菜单。 -->
              <div class="user-menu">
                <b>{{ user.name }}</b>
                <a v-for="m in userMenus" :key="m.text" :class="{ danger: m.danger }"
                   @click="m.danger ? doLogout() : go(m.view, true)">
                  <svg class="i" aria-hidden="true"><use :href="iconHref(m.icon)"></use></svg><span>{{ m.text }}</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- ------------------------------ 首页 ------------------------------ -->
      <section v-show="view === 'home'" class="page-body">
        <div class="hero">
          <div class="blob b1"></div><div class="blob b2"></div>
          <div class="hero-inner">
            <div class="hero-left">
              <div class="hero-hello">{{ greeting }}，{{ user.name }}</div>
              <div class="hero-title">林盘集章进度</div>
              <div class="hero-num"><b>{{ collected }}</b><span>/ {{ total }} 枚</span></div>
              <div class="hero-tip">{{ progressText }}</div>
              <button class="hero-btn" @click="go('spots', true)">继续打卡</button>
            </div>
            <div class="hero-ring">
              <!-- 每段对应一个点位，已打卡的点亮；中间是印章图标 + 百分比 -->
              <template v-if="!ringEmpty">
                <svg viewBox="0 0 128 128" class="ring-svg" aria-hidden="true">
                  <path v-for="(seg, i) in ringSegments" :key="i" :d="seg.d"
                        class="ring-seg" :class="{ on: seg.checked }"></path>
                </svg>
                <div class="ring-core">
                  <svg class="ico ring-ico"><use :href="iconHref('i-stamp')"></use></svg>
                  <em>{{ percent }}%</em>
                </div>
              </template>
              <!-- 点位数异常 / 没加载到时不画空圈，明确告诉用户「暂无可打卡点位」 -->
              <div v-else class="ring-empty">
                <svg class="ico"><use :href="iconHref('i-info')"></use></svg>
                <span>暂无可打卡点位</span>
              </div>
            </div>
          </div>
        </div>

        <div class="grid">
          <div class="grid-item" v-for="(e, i) in entries" :key="e.key"
               :style="{ animationDelay: (i * 45) + 'ms' }" @click="go(e.view, e.tab)">
            <div class="grid-icon" :style="{ background: e.bg, color: e.color }">
              <svg class="ico" aria-hidden="true"><use :href="iconHref(e.icon)"></use></svg>
            </div>
            <div class="grid-text">{{ e.text }}</div>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <div class="section-title"><i></i>林盘点位</div>
            <a class="section-more" @click="go('spots', true)">全部 ›</a>
          </div>
          <div class="hscroll">
            <div class="spot-card" v-for="s in spots" :key="s.id" @click="openSpot(s.id)">
              <div class="spot-cover">
                <img :src="asset(s.cover)" :alt="s.name" loading="lazy" @error="imgFail">
                <span class="spot-type">{{ s.type }}</span>
                <span v-if="s.checked" class="spot-seal"><svg class="ico"><use :href="iconHref(spotIcon(s))"></use></svg></span>
              </div>
              <b>{{ s.name }}</b>
              <span>{{ s.location }}</span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <div class="section-title"><i></i>农产文创好物</div>
            <a class="section-more" @click="go('shop', true)">去商城 ›</a>
          </div>
          <div class="pad-x">
            <div v-if="!goods.length" class="empty-box"><b>暂时没有在售商品</b></div>
            <div class="goods-row" v-for="p in goods" :key="p.id" @click="openProduct(p.id)">
              <img :src="cover(p.cover, p.category)" :alt="p.name" loading="lazy" @error="imgFail">
              <div class="goods-body">
                <b class="ell2">{{ p.name }}</b>
                <div class="tags"><span v-for="t in (p.tags || []).slice(0,2)" :key="t" class="tag tag-muted">{{ t }}</span></div>
                <div class="goods-foot">
                  <div class="price">{{ money(p.price) }}<em>/{{ p.unit || '份' }}</em></div>
                  <div class="dim tiny">已售 {{ p.sold || 0 }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section" v-if="activities.length">
          <div class="section-head">
            <div class="section-title"><i></i>近期活动</div>
            <a class="section-more" @click="go('activities')">活动日历 ›</a>
          </div>
          <div class="pad-x">
            <div class="act-row card" v-for="a in activities" :key="a.id">
              <div class="act-date"><b>{{ day(a.date) }}</b><span>{{ month(a.date) }} 月</span></div>
              <div class="act-body">
                <div class="act-top"><b>{{ a.title }}</b><span class="tag tag-accent">{{ a.tag }}</span></div>
                <div class="dim tiny">地点：{{ a.place }}</div>
              </div>
            </div>
          </div>
        </div>

        <footer class="page-foot">{{ site.name }}</footer>
      </section>

      <!-- ------------------------------ 点位打卡 ------------------------------ -->
      <section v-show="view === 'spots'" class="page-body">
        <div class="topbar">
          <div class="topbar-title">
            <h1>点位打卡集章</h1>
            <p>已集 {{ collected }} / {{ total }} 枚</p>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress"><i :style="{ width: percent + '%' }"></i></div>
          <div class="progress-tip">{{ progressText }}</div>
        </div>

        <div class="tabs tabs-pad">
          <div class="tab" :class="{ on: spotTab === 'spots' }" @click="spotTab = 'spots'">全部点位</div>
          <div class="tab" :class="{ on: spotTab === 'wall' }" @click="spotTab = 'wall'">我的印章墙</div>
        </div>

        <div class="pad-x" v-if="spotTab === 'spots'">
          <div v-if="loadingSpots" class="empty-box"><b>正在加载点位…</b></div>
          <div v-else-if="!spots.length" class="empty-box"><b>暂时没有点位数据</b></div>
          <div v-else class="card spot-item" v-for="s in spots" :key="s.id">
            <img class="spot-item-cover" :src="asset(s.cover)" :alt="s.name" loading="lazy" @click="openSpot(s.id)">
            <div class="spot-item-body">
              <div class="spot-item-top">
                <b>{{ s.name }}</b>
                <span class="tag" :class="s.checked ? 'tag-ok' : 'tag-muted'">{{ s.checked ? '已打卡' : '未打卡' }}</span>
              </div>
              <div class="dim tiny">{{ s.type }} · {{ s.location }}</div>
              <p class="ell2 small">{{ s.intro }}</p>
              <div class="spot-item-foot">
                <span class="dim tiny">{{ s.checked ? ago(s.checkedAt) + '打卡' : '盖「' + s.stamp + '」印章' }}</span>
                <button class="btn btn-sm" :class="s.checked ? 'btn-ghost' : ''" @click="checkin(s)">
                  {{ s.checked ? '再打一次' : '立即打卡' }}
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="pad-x" v-else>
          <div v-if="!stamps.length" class="empty-box"><b>集章册还是空的</b><p>到点位点一下「立即打卡」就能得到第一枚印章。</p></div>
          <template v-else>
            <div class="wall">
              <div class="seal" v-for="st in stamps" :key="st.id">
                <div class="seal-circle"><svg class="ico"><use :href="iconHref(spotIcon(st))"></use></svg></div>
                <b>{{ st.stamp || st.spotName }}</b>
                <span>{{ date(st.at) }}</span>
              </div>
            </div>
            <div v-if="allDone" class="done-box">
              <b>恭喜集齐全部 {{ total }} 枚印章</b>
              <p>你已走遍战旗村的主要林盘点位，可在游客服务中心出示本页面领取纪念品。</p>
            </div>
          </template>
        </div>
        <div class="page-bottom-space"></div>
      </section>

      <!-- ------------------------------ 商城 ------------------------------ -->
      <section v-show="view === 'shop'" class="page-body">
        <div class="topbar topbar-shop">
          <div class="topbar-title"><h1>农产文创商城</h1><p>战旗村直供 · 现摘现发</p></div>
          <div class="search">
            <input class="input search-input" v-model.trim="keyword" placeholder="搜商品名或卖点" @keyup.enter="loadProducts">
          </div>
        </div>

        <div class="tabs tabs-pad cats">
          <div class="tab" v-for="c in cats" :key="c.key" :class="{ on: category === c.key }" @click="switchCategory(c.key)">
            {{ c.text }}
          </div>
        </div>

        <div class="pad-x">
          <div v-if="loadingProducts" class="empty-box"><b>正在加载商品…</b></div>
          <div v-else-if="!products.length" class="empty-box"><b>没有找到相关商品</b><p>换个关键词或分类试试。</p></div>
          <div v-else class="goods-grid">
            <div class="goods-cell" v-for="p in products" :key="p.id" @click="openProduct(p.id)">
              <div class="goods-cell-cover">
                <img :src="cover(p.cover, p.category)" :alt="p.name" loading="lazy" @error="imgFail">
                <span class="cell-cat">{{ p.categoryText }}</span>
                <span v-if="p.stock <= 5" class="cell-low">仅剩 {{ p.stock }}</span>
              </div>
              <div class="goods-cell-body">
                <b class="ell2">{{ p.name }}</b>
                <div class="goods-cell-foot">
                  <div class="price">{{ money(p.price) }}<em>/{{ p.unit || '份' }}</em></div>
                  <!-- 农产文创才能加购；研学/民宿/农事体验必须去详情页预约，按钮文案明确区分 -->
                  <button v-if="p.category === 'goods'" class="add-btn" title="加入购物车" @click.stop="addCart(p)">＋</button>
                  <button v-else class="add-btn book-btn" title="去预约" @click.stop="openProduct(p.id)">预约</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 购物车浮标 -->
        <button v-if="cartCount > 0" class="cart-fab" @click="cartOpen = true">
          <span>车</span><i>{{ cartCount }}</i>
        </button>
        <div class="page-bottom-space"></div>
      </section>

      <!-- ------------------------------ 我的 ------------------------------ -->
      <section v-show="view === 'mine'" class="page-body">
        <div class="hero hero-mine">
          <div class="blob b1"></div><div class="blob b2"></div>
          <div class="hero-inner">
            <div class="my-avatar" @click="$refs.avatarInput.click()">
              <img :src="avatarSrc" alt="头像">
              <span class="avatar-edit">
                <svg class="ico"><use :href="iconHref('i-camera')"></use></svg>
              </span>
            </div>
            <input ref="avatarInput" type="file" accept="image/*" hidden @change="onAvatarPick">
            <div class="my-body">
              <b>{{ user.name }}</b>
              <span>{{ avatarUrl ? '点击头像可更换' : '点击头像上传照片' }}</span>
            </div>
            <button class="btn-ghost-light" @click="doLogout">退出</button>
          </div>
        </div>

        <div class="stats card">
          <div class="stat" @click="go('spots', true); spotTab='wall'">
            <b>{{ collected }}</b><span>枚印章</span>
          </div>
          <i class="stat-sep"></i>
          <div class="stat" @click="openOrders()"><b>{{ orderCount }}</b><span>笔订单</span></div>
          <i class="stat-sep"></i>
          <div class="stat"><b>{{ money(spent) }}</b><span>累计消费</span></div>
        </div>

        <div class="pad-x">
          <div class="card">
            <div class="card-title"><i></i>我的印章墙</div>
            <div class="wall wall-mini">
              <div class="seal" v-for="(st, i) in stamps.slice(0, 8)" :key="i">
                <div class="seal-circle"><svg class="ico"><use :href="iconHref(spotIcon(st))"></use></svg></div>
                <b>{{ st.stamp || st.spotName }}</b>
              </div>
              <div class="seal" v-for="n in Math.max(0, 8 - stamps.length)" :key="'e' + n">
                <div class="seal-circle seal-off"><svg class="ico"><use :href="iconHref('i-stamp')"></use></svg></div>
                <b class="dim">未获得</b>
              </div>
            </div>
          </div>

          <!-- 个性化设置：紧跟在印章墙下方，进「我的」就能看到（需求：上移） -->
          <div class="card">
            <div class="card-title"><i></i>个性化设置</div>
            <div class="settings-row">
              <div>
                <b>界面主题</b>
                <span class="dim tiny">深色适合夜间，卡片与弹窗整体跟随</span>
              </div>
              <div class="theme-switch">
                <button v-for="t in themeOptions" :key="t.key" class="theme-opt"
                        :class="{ on: themeMode === t.key }" @click="setTheme(t.key)">
                  <span class="theme-dot" :style="{ background: t.dot }"></span>{{ t.text }}</button>
              </div>
            </div>
          </div>

          <div class="card menu">
            <!-- 每一项都画分隔线：之前用「不是最后一项才画」，但 menus 后面还跟着「修改密码」，
                 导致举报中心（数组最后一项）和修改密码之间缺一条线。 -->
            <div class="menu-item menu-line" v-for="m in menus" :key="m.key" @click="go(m.view, m.tab)">
              <div class="menu-icon" :style="{ background: m.bg, color: m.color }">
                <svg class="ico" aria-hidden="true"><use :href="iconHref(m.icon)"></use></svg>
              </div>
              <div class="menu-body"><b>{{ m.text }}</b><span>{{ m.desc }}</span></div>
              <div class="menu-arrow"><svg class="ico"><use :href="iconHref('i-arrow-right')"></use></svg></div>
            </div>
            <!-- 举报中心（menus 最后一项）与修改密码之间要有分隔线：
                 原来靠「不是最后一项才加 menu-line」的规则，举报中心恰好是最后一项，
                 所以它下面没有线 —— 这里给修改密码显式加 menu-line 补上。 -->
            <div class="menu-item menu-line" @click="openPwd">
              <div class="menu-icon" style="background:#FCF4E2;color:#B07A18">
                <svg class="ico" aria-hidden="true"><use :href="iconHref('i-shield')"></use></svg>
              </div>
              <div class="menu-body"><b>修改密码</b><span>定期更换，账号更安全</span></div>
              <div class="menu-arrow"><svg class="ico"><use :href="iconHref('i-arrow-right')"></use></svg></div>
            </div>
          </div>

          <!-- 我的活动预约：报名信息由管理后台统一确认 -->
          <div class="card book-mine" v-if="myBookings.length">
            <div class="card-title"><i></i>我的活动预约</div>
            <div v-for="b in myBookings" :key="b.id" class="book-mine-row">
              <div class="book-mine-main" @click="openActivity(b.activityId)">
                <b>{{ b.activityTitle }}</b>
                <span class="dim tiny">{{ b.date }} · {{ b.people }} 人 · {{ bookingStatusText(b.status) }}</span>
              </div>
              <button v-if="b.status !== 'cancelled'" class="btn btn-ghost btn-xs" @click="cancelBooking(b)">取消</button>
              <span v-else class="tag">已取消</span>
            </div>
          </div>

          <div class="card about">
            <b>{{ site.name }}</b>
            <span>川西林盘农商文旅智慧服务平台 · 游客端 v1.0.0</span>
            <span class="dim">本端提供点位打卡集章、农产文创商城、研学民宿预约与 AI 文旅助手服务。</span>
          </div>
        </div>
        <div class="page-bottom-space"></div>
      </section>

      <!-- ==================================================================
           子页面（从 Tab 页推入，带返回）
           ================================================================== -->

      <!-- 点位详情 -->
      <section v-if="view === 'spotDetail'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>{{ current.name || '点位详情' }}</h1><p>{{ current.type }}</p></div>
        </div>
        <div v-if="current.id">
          <!-- 点位图集：停留时定时轮播下一张，配合语音讲解一起看 -->
          <div class="cover-lg spot-gallery">
            <img :src="asset(spotGalleryImage)" :alt="current.name" @error="imgFail">
            <span v-if="spotImages.length > 1" class="sg-count">{{ spotGalleryIndex + 1 }} / {{ spotImages.length }}</span>
            <button v-if="spotImages.length > 1" class="sg-nav prev" @click="stepSpotImage(-1)">‹</button>
            <button v-if="spotImages.length > 1" class="sg-nav next" @click="stepSpotImage(1)">›</button>
            <div v-if="spotImages.length > 1" class="sg-dots">
              <i v-for="(img, i) in spotImages" :key="i" :class="{ on: i === spotGalleryIndex }"
                 @click="spotGalleryIndex = i"></i>
            </div>
          </div>

          <div class="pad-x">
            <div class="card">
              <div class="card-title">
                <i :class="{ live: speaking }"></i>语音讲解
                <!-- 音色名直接显示出来，点一下可以在设备可用的中文音色间切换：
                     不同手机/浏览器装的自然音色差别很大，让人能自己挑一个顺耳的。 -->
                <span class="dim tiny" style="margin-left:auto;cursor:pointer" @click="switchVoice"
                      title="切换语音音色">{{ voiceText() }}</span>
              </div>
              <div class="row gap">
                <button class="btn btn-sm" @click="toggleSpeak">{{ speaking ? '停止朗读' : '播放讲解' }}</button>
                <button class="btn btn-ghost btn-sm" @click="showScript = !showScript">{{ showScript ? '收起文稿' : '查看文稿' }}</button>
              </div>
              <div v-if="speaking" class="wave"><i v-for="n in 18" :key="n" :style="waveStyle(n)"></i></div>
              <p v-if="showScript" class="script">{{ current.tts || current.intro }}</p>
            </div>

            <div class="card">
              <div class="card-title"><i></i>点位介绍</div>
              <p class="para">{{ current.intro }}</p>
            </div>

            <!-- 点位在地图上的位置：与「村内地图」共用同一个 SVG 控件，
                 只画当前这一个点，并把它居中放大，方便看出它在村里的哪一片。 -->
            <div class="card" v-if="current.mapX != null && current.mapY != null">
              <div class="card-title"><i class="accent"></i>在地图上的位置</div>
              <div class="detail-map" ref="spotMapBox"></div>
              <p class="dim tiny detail-map-tip">
                <svg class="ico" aria-hidden="true"><use :href="iconHref('i-location')"></use></svg>
                {{ current.location || '战旗村' }}
                <a class="detail-map-more" @click="openMapFocus(current.mapX, current.mapY)">在村内地图中查看 ›</a>
              </p>
            </div>

            <div class="card seal-box">
              <div class="seal-circle" :class="{ 'seal-off': !current.checked }"><svg class="ico"><use :href="iconHref(spotIcon(current))"></use></svg></div>
              <div>
                <b>「{{ current.stamp }}」印章</b>
                <p class="dim small">{{ current.checked ? '已于 ' + time(current.checkedAt) + ' 收入集章册' : '到点位打卡即可获得这枚印章' }}</p>
              </div>
            </div>

            <button v-if="!current.checked" class="btn btn-block" @click="checkin(current)">打卡盖「{{ current.stamp }}」印章</button>
            <button v-else class="btn btn-ghost btn-block" @click="go('spots', true); spotTab='wall'">查看我的印章墙</button>
          </div>
        </div>
        <div v-else class="empty-box"><b>没找到这个点位</b></div>
        <div class="page-bottom-space"></div>
      </section>

      <!-- 商品详情 -->
      <section v-if="view === 'productDetail'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>{{ product.name || '商品详情' }}</h1><p>{{ product.categoryText }}</p></div>
        </div>
        <div v-if="product.id">
          <!-- 商品图集：左右翻页 + 圆点，最多 3 张 -->
          <div class="cover-lg spot-gallery">
            <img :src="cover(productGalleryImage || product.cover, product.category)" :alt="product.name" @error="imgFail">
            <span v-if="productImages.length > 1" class="sg-count">{{ productGalleryIndex + 1 }} / {{ productImages.length }}</span>
            <button v-if="productImages.length > 1" class="sg-nav prev" @click="stepProductImage(-1)">‹</button>
            <button v-if="productImages.length > 1" class="sg-nav next" @click="stepProductImage(1)">›</button>
            <div v-if="productImages.length > 1" class="sg-dots">
              <i v-for="(img, i) in productImages" :key="i" :class="{ on: i === productGalleryIndex }"
                 @click="productGalleryIndex = i"></i>
            </div>
          </div>
          <div class="pad-x">
            <div class="card">
              <div class="price-lg">{{ money(product.price) }}<em>/ {{ product.unit || '份' }}</em></div>
              <b class="product-name">{{ product.name }}</b>
              <div class="tags mt10"><span v-for="t in product.tags || []" :key="t" class="tag">{{ t }}</span></div>
              <div class="stat-line">
                <span>已售 {{ product.sold || 0 }}</span>
                <span>库存 {{ product.stock || 0 }} {{ product.unit || '份' }}</span>
                <span>{{ product.merchantName }}</span>
              </div>
            </div>

            <!-- 发布商家：头像/店名/类型，可进商家主页或直接找客服 -->
            <div class="card" v-if="product.merchantId || product.merchantName">
              <div class="card-title"><i></i>发布商家</div>
              <div class="merchant-row">
                <img class="merchant-avatar" :src="avatarFrom(productMerchant)" alt=""
                     @click="product.merchantId && openMerchant(product.merchantId, productMerchant)" @error="imgFail">
                <div class="merchant-meta"
                     @click="product.merchantId && openMerchant(product.merchantId, productMerchant)">
                  <b>{{ productMerchant.name || product.merchantName || '村内商家' }}</b>
                  <span class="dim tiny">{{ merchantType(productMerchant) }}</span>
                </div>
                <button v-if="product.merchantId" class="btn btn-ghost btn-xs"
                        @click="openChat(product.merchantId, productMerchant.name || product.merchantName)">客服</button>
              </div>
              <div v-if="product.merchantId" class="row gap mt10">
                <a class="dim tiny" @click="openMerchant(product.merchantId, productMerchant)">进入商家主页 ›</a>
                <a class="dim tiny" @click="openReports({ merchantId: product.merchantId, merchantName: productMerchant.name || product.merchantName })">举报商家</a>
              </div>
            </div>

            <div class="card">
              <div class="card-title"><i></i>商品介绍</div>
              <p class="para">{{ product.desc || '商家还没有填写详细介绍。' }}</p>
              <p v-if="product.intro" class="para dim sub-para">{{ product.intro }}</p>
            </div>

            <!--
              需到店的项目在地图上的位置：研学 / 民宿 / 农事三类都有实体地点，
              只画当前商品所属商家标定的那一个点（与村内地图同一套控件）。
              农产文创是快递发货，没有「到店位置」，所以不显示。
            -->
            <div class="card" v-if="product.mapX != null && product.mapY != null && product.category !== 'goods'">
              <div class="card-title"><i class="accent"></i>{{ product.category === 'homestay' ? '民宿位置' : (product.category === 'study' ? '研学地点' : '体验地点') }}</div>
              <div class="detail-map" ref="productMapBox"></div>
              <p class="dim tiny detail-map-tip">
                <svg class="ico" aria-hidden="true"><use :href="iconHref('i-location')"></use></svg>
                {{ productMerchant.address || productMerchant.name || '战旗村' }}
                <a class="detail-map-more" @click="openMapFocus(product.mapX, product.mapY)">在村内地图中查看 ›</a>
              </p>
            </div>

            <!-- 四类购买表单：goods 收货地址 / study 日期+场次 / homestay 入住+离店+房型 / experience 日期+时段 -->
            <div class="card" v-if="product.category === 'goods'">
              <div class="card-title"><i></i>收货信息</div>
              <label class="field"><span>收货地址</span>
                <input class="input" v-model.trim="address" placeholder="省市区 + 详细地址">
              </label>
            </div>

            <div class="card" v-else-if="product.category === 'study'">
              <div class="card-title"><i class="accent"></i>研学预约信息</div>
              <label class="field"><span>上课日期</span>
                <input class="input" type="date" v-model="bookDate" :min="today">
              </label>
              <div class="field">
                <span>场次</span>
                <div class="chips">
                  <button v-for="s in productSlots" :key="s" :class="{ on: bookingSlot === s }"
                          @click="bookingSlot = s">{{ s }}</button>
                </div>
              </div>
              <div class="field">
                <span>参加人数</span>
                <div class="stepper">
                  <button @click="people = Math.max(1, people - 1)">−</button>
                  <b>{{ people }}</b>
                  <button @click="people = Math.min(20, people + 1)">＋</button>
                </div>
              </div>
            </div>

            <div class="card" v-else-if="product.category === 'homestay'">
              <div class="card-title"><i class="accent"></i>入住信息</div>
              <label class="field"><span>入住日期</span>
                <input class="input" type="date" v-model="bookDate" :min="today">
              </label>
              <label class="field"><span>离店日期</span>
                <input class="input" type="date" v-model="checkOutDate" :min="bookDate || today">
              </label>
              <div class="field">
                <span>房型</span>
                <div class="chips">
                  <button v-for="r in productRooms" :key="r" :class="{ on: roomType === r }"
                          @click="roomType = r">{{ r }}</button>
                </div>
              </div>
              <div class="field">
                <span>入住人数</span>
                <div class="stepper">
                  <button @click="people = Math.max(1, people - 1)">−</button>
                  <b>{{ people }}</b>
                  <button @click="people = Math.min(20, people + 1)">＋</button>
                </div>
              </div>
            </div>

            <div class="card" v-else-if="product.category === 'experience'">
              <div class="card-title"><i class="accent"></i>体验预约信息</div>
              <label class="field"><span>体验日期</span>
                <input class="input" type="date" v-model="bookDate" :min="today">
              </label>
              <div class="field">
                <span>时段</span>
                <div class="chips">
                  <button v-for="s in productSlots" :key="s" :class="{ on: bookingSlot === s }"
                          @click="bookingSlot = s">{{ s }}</button>
                </div>
              </div>
              <div class="field">
                <span>参加人数</span>
                <div class="stepper">
                  <button @click="people = Math.max(1, people - 1)">−</button>
                  <b>{{ people }}</b>
                  <button @click="people = Math.min(20, people + 1)">＋</button>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title"><i></i>备注</div>
              <textarea class="input textarea" v-model.trim="remark" maxlength="200" placeholder="有特殊要求可以写在这里，商家会看到"></textarea>
            </div>

            <div class="card row-between" v-if="product.category === 'goods'">
              <b>数量</b>
              <div class="stepper">
                <button @click="qty = Math.max(1, qty - 1)">−</button>
                <b>{{ qty }}</b>
                <button @click="qty = Math.min(product.stock || 1, qty + 1)">＋</button>
              </div>
            </div>
          </div>

          <div class="bottom-bar">
            <div class="bottom-total"><span>合计</span><b>{{ money(productTotal) }}</b></div>
            <!-- 只有农产文创能加购；预约类只能「立即预约」，不给加购入口 -->
            <button v-if="!isBooking" class="btn btn-ghost" @click="addCart(product, qty)">加入购物车</button>
            <button class="btn" :disabled="product.stock <= 0" @click="buyNow">
              {{ product.stock <= 0 ? '已售罄' : (isBooking ? '立即预约' : '立即购买') }}
            </button>
          </div>
          <p v-if="isBooking" class="dim tiny co-tip">预约类项目需选择日期与场次，不支持加入购物车</p>
          <div class="page-bottom-space tall"></div>
        </div>
        <div v-else class="empty-box"><b>没找到这件商品</b></div>
      </section>

      <!-- 商家主页：店铺信息 + 客服 + 在售商品 -->
      <section v-if="view === 'merchantHome'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>{{ merchantHome.name || '商家主页' }}</h1><p>店铺信息与在售商品</p></div>
        </div>

        <div v-if="merchantHomeLoading && !merchantHome.name" class="empty-box"><b>正在加载商家信息…</b></div>
        <template v-else>
          <div class="pad-x">
            <div class="card merchant-hero">
              <img class="merchant-avatar-lg" :src="avatarFrom(merchantHome)" alt="" @error="imgFail">
              <div class="merchant-meta">
                <b>{{ merchantHome.name || '村内商家' }}</b>
                <span class="dim tiny">{{ merchantType(merchantHome) }}</span>
                <span v-if="merchantHome.phone" class="dim tiny">电话 {{ merchantHome.phone }}</span>
              </div>
              <button v-if="merchantHome.id" class="btn btn-sm"
                      @click="openChat(merchantHome.id, merchantHome.name)">客服</button>
            </div>

            <div class="card" v-if="merchantHome.intro || merchantHome.desc">
              <div class="card-title"><i></i>商家介绍</div>
              <p class="para">{{ merchantHome.intro || merchantHome.desc }}</p>
              <a class="dim tiny" @click="openReports({ merchantId: merchantHome.id, merchantName: merchantHome.name })">举报此商家</a>
            </div>

            <div class="section-head section-head-flat">
              <div class="section-title"><i></i>在售商品</div>
              <span class="dim tiny">{{ merchantHomeProducts.length }} 件</span>
            </div>
            <div v-if="merchantHomeLoading" class="empty-box"><b>正在加载商品…</b></div>
            <div v-else-if="!merchantHomeProducts.length" class="empty-box"><b>商家暂时没有在售商品</b><p>可以先去聊聊，问问什么时候上新。</p></div>
            <div v-else class="goods-grid">
              <div class="goods-cell" v-for="p in merchantHomeProducts" :key="p.id" @click="openProduct(p.id)">
                <div class="goods-cell-cover">
                  <img :src="cover(p.cover, p.category)" :alt="p.name" loading="lazy" @error="imgFail">
                  <span class="cell-cat">{{ p.categoryText }}</span>
                </div>
                <div class="goods-cell-body">
                  <b class="ell2">{{ p.name }}</b>
                  <div class="goods-cell-foot">
                    <div class="price">{{ money(p.price) }}<em>/{{ p.unit || '份' }}</em></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
        <div class="page-bottom-space"></div>
      </section>

      <!--
        我的消息：会话列表。
        以前只有电脑版有这一页，手机端想联系商家必须先翻到某个商品详情的「客服」按钮，
        进过一次之后就再也找不回来。统一游客端后两处入口并存。
      -->
      <section v-if="view === 'chatList'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>我的消息</h1><p>与商家的沟通记录</p></div>
          <button class="btn btn-ghost btn-xs" @click="loadChatThreads">刷新</button>
        </div>
        <div class="pad-x">
          <div v-if="chatThreadsLoading" class="sk-list">
            <div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div>
          </div>
          <div v-else-if="!chatThreads.length" class="empty-box">
            <b>还没有会话</b>
            <p>在商品详情点「客服」，或在商家主页联系商家，就能开始对话。</p>
            <button class="btn btn-sm" @click="go('shop', true)">去逛商城</button>
          </div>
          <div v-else class="thread-list">
            <div class="thread-row" v-for="t in chatThreads" :key="t.merchantId"
                 @click="openChat(t.merchantId, t.merchantName)">
              <span class="thread-avatar">
                <img :src="t.merchantAvatar || defaultAvatar" alt="" @error="imgFail">
                <i v-if="t.online" class="online-dot"></i>
              </span>
              <div class="thread-main">
                <div class="thread-head">
                  <b class="ell1">{{ t.merchantName }}</b>
                  <span class="dim tiny">{{ time(t.lastAt) }}</span>
                </div>
                <p class="dim small ell1">{{ t.lastText || '还没有消息，去打个招呼吧' }}</p>
              </div>
              <span v-if="t.unread" class="thread-unread">{{ t.unread }}</span>
            </div>
          </div>
        </div>
        <div class="page-bottom-space"></div>
      </section>

      <!-- 商家客服聊天（移动端简版）：文字 / 商品卡 / 订单卡 / 图片 / 拍摄 -->
      <section v-if="view === 'chat'" class="page-body subpage im-page">
        <div class="topbar im-topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title">
            <h1>{{ chatMerchant.name || '在线客服' }}</h1>
            <p :class="{ on: chatOnline }">{{ chatPeerText }}</p>
          </div>
          <button class="im-report" @click="reportFromChat">举报</button>
        </div>

        <div class="im-scroll" ref="imScroll">
          <div v-if="!chatMessages.length" class="empty-box">
            <b>还没有聊天记录</b>
            <p>有问题直接问商家；也可以发商品、订单或图片，商家能看到同一份信息。</p>
          </div>

          <div class="im-msg" :class="m.fromRole === 'buyer' ? 'mine' : 'theirs'"
               v-for="(m, i) in chatMessages" :key="m.id || i">
            <div v-if="m.type === 'text'" class="im-bubble">{{ m.text }}</div>

            <div v-else-if="m.type === 'image'" class="im-bubble im-bubble-img">
              <img :src="m.media || m.text" alt="聊天图片" @error="imgFail">
            </div>

            <div v-else-if="m.type === 'product'" class="im-bubble im-bubble-card"
                 @click="m.productId && openProduct(m.productId)">
              <div class="im-card-title">
                <img :src="cover(chatProductOf(m).cover, chatProductOf(m).category)" alt="" @error="imgFail">
                <div>
                  <b class="ell2">{{ chatProductOf(m).name || m.productName || m.text || '商品' }}</b>
                  <span class="im-card-sub">商品卡片 · 点击查看</span>
                </div>
              </div>
            </div>

            <div v-else-if="m.type === 'order'" class="im-bubble im-bubble-card"
                 @click="m.orderId && openOrder(m.orderId)">
              <b class="ell2">{{ chatOrderOf(m).productName || m.productName || m.text || '订单' }}</b>
              <span class="im-card-sub">订单 {{ chatOrderOf(m).id || m.orderId }} · {{ money(chatOrderOf(m).amount || m.amount) }}</span>
              <span class="im-card-sub">{{ statusText(chatOrderOf(m).status || m.status) }} · 点击查看</span>
            </div>

            <div v-else class="im-bubble">{{ m.text || '[消息]' }}</div>
          </div>

          <div v-if="chatPeerTyping" class="im-typing">对方正在输入…</div>
        </div>

        <input ref="chatImage" type="file" accept="image/*" hidden @change="onChatImage">
        <input ref="chatCamera" type="file" accept="image/*" capture="environment" hidden @change="onChatImage">

        <div v-if="chatPanel" class="im-panel">
          <div class="im-panel-tabs">
            <button :class="{ on: chatPicker === '' }" @click="chatPicker = ''">快捷</button>
            <button :class="{ on: chatPicker === 'product' }" @click="openChatPicker('product')">商品</button>
            <button :class="{ on: chatPicker === 'order' }" @click="openChatPicker('order')">订单</button>
          </div>

          <div v-if="chatPicker === ''" class="im-quick">
            <button @click="$refs.chatImage.click()">
              <svg class="ico"><use :href="iconHref('i-camera')"></use></svg><span>图片</span>
            </button>
            <button @click="$refs.chatCamera.click()">
              <svg class="ico"><use :href="iconHref('i-camera')"></use></svg><span>拍摄</span>
            </button>
            <button @click="openChatPicker('product')">
              <svg class="ico"><use :href="iconHref('i-shop')"></use></svg><span>商品</span>
            </button>
            <button @click="openChatPicker('order')">
              <svg class="ico"><use :href="iconHref('i-ticket')"></use></svg><span>订单</span>
            </button>
          </div>

          <div v-else-if="chatPicker === 'product'" class="im-pick-list">
            <div v-if="!chatProducts.length" class="dim tiny">商家暂无可发送的商品。</div>
            <div v-else class="im-pick-item" v-for="p in chatProducts" :key="p.id" @click="sendChatProduct(p)">
              <img :src="cover(p.cover, p.category)" alt="" @error="imgFail">
              <div class="im-pick-body">
                <b class="ell1">{{ p.name }}</b>
                <span class="dim tiny">{{ money(p.price) }} / {{ p.unit || '份' }}</span>
              </div>
              <span class="im-pick-go">发送</span>
            </div>
          </div>

          <div v-else class="im-pick-list">
            <div v-if="!chatOrders.length" class="dim tiny">你在该商家还没有订单。</div>
            <div v-else class="im-pick-item" v-for="o in chatOrders" :key="o.id" @click="sendChatOrder(o)">
              <img :src="cover(o.cover, o.category)" alt="" @error="imgFail">
              <div class="im-pick-body">
                <b class="ell1">{{ o.productName }}</b>
                <span class="dim tiny">{{ money(o.amount) }} · {{ statusText(o.status) }}</span>
              </div>
              <span class="im-pick-go">发送</span>
            </div>
          </div>
        </div>

        <div class="im-input">
          <button class="im-plus" @click="chatPanel = !chatPanel">＋</button>
          <input class="input" v-model.trim="chatText" placeholder="输入消息…" @input="onChatInput" @keyup.enter="sendChat">
          <button class="btn" :disabled="!chatText || chatSending" @click="sendChat">发送</button>
        </div>
      </section>

      <!-- 我的订单 / 结算 -->
      <section v-if="view === 'orders'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>{{ checkoutMode ? '确认订单' : '我的订单' }}</h1>
            <p>{{ checkoutMode ? '逐项确认信息后提交' : '按状态筛选' }}</p></div>
        </div>

        <!-- 结算：每个商品一行，各自一份信息表单 -->
        <div class="pad-x" v-if="checkoutMode">
          <div class="card co-intro">
            <b>确认订单</b>
            <p class="dim tiny">共 {{ cart.length }} 项，请逐项确认信息后提交</p>
          </div>

          <div class="card co-item" v-for="(L, li) in checkoutLines()" :key="L.key">
            <div class="co-head">
              <img :src="cover(L.cover, L.category)" :alt="L.name" @error="imgFail">
              <div class="co-head-main">
                <b class="ell2">{{ L.name }}</b>
                <span class="dim tiny">{{ categoryName(L.category) }} · {{ money(L.price) }} / {{ L.unit || '份' }}</span>
              </div>
              <div class="co-head-price">{{ money(lineSubtotal(L)) }}</div>
            </div>

            <!-- 实物：收货地址 + 数量 -->
            <template v-if="!L.isBooking">
              <label class="field"><span>收货地址</span>
                <input class="input" v-model.trim="L.form.address" placeholder="省市区 + 详细地址"></label>
              <div class="field">
                <span>数量</span>
                <div class="stepper">
                  <button @click="L.qty = Math.max(1, L.qty - 1); setQty(L.productId, L.qty)">−</button>
                  <b>{{ L.qty }}</b>
                  <button @click="L.qty = Math.min(L.stock || 99, L.qty + 1); setQty(L.productId, L.qty)">＋</button>
                </div>
              </div>
            </template>

            <!-- 民宿：入住 / 离店 / 房型 / 人数 -->
            <template v-else-if="L.category === 'homestay'">
              <div class="field-row">
                <label class="field"><span>入住日期</span>
                  <input class="input" type="date" :min="today" v-model="L.form.bookDate"></label>
                <label class="field"><span>离店日期</span>
                  <input class="input" type="date" :min="L.form.bookDate || today" v-model="L.form.checkOutDate"></label>
              </div>
              <div class="field-row">
                <label class="field"><span>房型</span>
                  <select class="input" v-model="L.form.roomType">
                    <option v-for="r in (L.roomTypes.length ? L.roomTypes : ['标准间'])" :key="r" :value="r">{{ r }}</option>
                  </select></label>
                <label class="field"><span>人数</span>
                  <input class="input" type="number" min="1" max="20" v-model.number="L.form.people"></label>
              </div>
              <p class="dim tiny co-note">共 {{ nightsBetween(L.form.bookDate, L.form.checkOutDate) }} 晚</p>
            </template>

            <!-- 研学 / 农事体验：日期 / 场次 / 人数 -->
            <template v-else>
              <div class="field-row">
                <label class="field"><span>预约日期</span>
                  <input class="input" type="date" :min="today" v-model="L.form.bookDate"></label>
                <label class="field"><span>人数</span>
                  <input class="input" type="number" min="1" max="20" v-model.number="L.form.people"></label>
              </div>
              <label class="field"><span>场次 / 时段</span>
                <select class="input" v-model="L.form.bookingSlot">
                  <option v-for="s in (L.timeSlots.length ? L.timeSlots : ['上午场','下午场'])" :key="s" :value="s">{{ s }}</option>
                </select></label>
            </template>
          </div>

          <div class="card">
            <label class="field"><span>备注（整单共用）</span>
              <textarea class="input textarea" v-model.trim="remark" maxlength="200" placeholder="选填，商家会看到"></textarea>
            </label>
          </div>

          <div class="card row-between">
            <div class="bottom-total"><span>合计</span><b>{{ money(checkoutTotal()) }}</b></div>
            <button class="btn" :disabled="submitting" @click="submitCart">{{ submitting ? '提交中…' : '提交订单' }}</button>
          </div>
        </div>

        <!-- 订单列表 -->
        <template v-else>
          <div class="tabs tabs-pad">
            <div class="tab" v-for="s in statuses" :key="s.key" :class="{ on: orderStatusFilter === s.key }"
                 @click="orderStatusFilter = s.key; loadOrders()">{{ s.text }}</div>
          </div>
          <div class="pad-x">
            <div v-if="loadingOrders" class="empty-box"><b>正在加载订单…</b></div>
            <div v-else-if="!orders.length" class="empty-box">
              <b>还没有订单</b><p>去商城或研学预约看看，村里有不少好东西。</p>
            </div>
            <div v-else class="card order-card" v-for="o in orders" :key="o.id" @click="openOrder(o.id)">
              <div class="order-head">
                <span class="dim tiny">单号 {{ o.id }}</span>
                <span class="tag" :class="statusClass(o.status)">{{ statusText(o.status) }}</span>
              </div>
              <div class="order-main">
                <img :src="cover(o.cover, o.category)" :alt="o.productName" loading="lazy" @error="imgFail">
                <div class="order-body">
                  <b class="ell2">{{ o.productName }}</b>
                  <span class="dim tiny">{{ o.merchantName }} · {{ o.categoryText }}</span>
                  <span v-if="o.bookDate" class="dim tiny">预约日期：{{ o.bookDate }} · {{ o.people }} 人</span>
                  <span v-if="o.address" class="dim tiny ell1">收货：{{ o.address }}</span>
                </div>
              </div>
              <div class="order-foot">
                <span class="dim tiny">{{ time(o.createdAt) }}</span>
                <div class="row gap10">
                  <b class="price">{{ money(o.amount) }}</b>
                  <button v-if="canCancel(o)" class="btn btn-ghost btn-xs" @click.stop="cancelOrder(o)">取消</button>
                </div>
              </div>
            </div>
          </div>
        </template>
        <div class="page-bottom-space"></div>
      </section>

      <!-- 订单详情：状态 / 商品 / 商家 / 拒绝协商 / 物流 / 预约信息 -->
      <section v-if="view === 'orderDetail'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>订单详情</h1><p>{{ orderDetail.id ? '单号 ' + orderDetail.id : '' }}</p></div>
        </div>

        <div v-if="orderDetailLoading" class="empty-box"><b>正在加载订单…</b></div>
        <div v-else-if="!orderDetail.id" class="empty-box"><b>没找到这个订单</b><p>可能已被删除，或不属于当前账号。</p></div>

        <div v-else class="pad-x">
          <div class="card order-hero">
            <div class="row-between">
              <div>
                <div class="order-state">{{ statusText(orderDetail.status) }}</div>
                <div class="dim tiny mt6">{{ orderStatusTip(orderDetail) }}</div>
              </div>
              <div class="order-amount">{{ money(orderDetail.amount) }}<em>共 {{ orderDetail.qty || orderDetail.people || 1 }} {{ orderDetail.unit || '件' }}</em></div>
            </div>
            <div class="order-time dim tiny">
              下单 {{ time(orderDetail.createdAt) }}<template v-if="orderDetail.confirmedAt"> · 确认 {{ time(orderDetail.confirmedAt) }}</template><template v-if="orderDetail.shippedAt"> · 发货 {{ time(orderDetail.shippedAt) }}</template>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><i></i>商品信息</div>
            <div class="line-item" @click="orderDetail.productId && openProduct(orderDetail.productId)">
              <img :src="cover(orderDetail.cover, orderDetail.category)" :alt="orderDetail.productName" @error="imgFail">
              <div class="line-body">
                <b class="ell1">{{ orderDetail.productName }}</b>
                <span class="dim tiny">{{ categoryName(orderDetail.category) }} · {{ money(orderDetail.price || (orderDetail.amount / (orderDetail.qty || 1))) }} × {{ orderDetail.qty }}</span>
              </div>
              <div v-if="orderDetail.productId" class="dim tiny">查看 ›</div>
            </div>
          </div>

          <!-- 商家信息：电话 / 客服 / 商家主页 / 举报 -->
          <div class="card">
            <div class="card-title"><i></i>商家信息</div>
            <div class="merchant-row">
              <img class="merchant-avatar" :src="avatarFrom(orderDetail)" alt="" @error="imgFail">
              <div class="merchant-meta">
                <b>{{ orderMerchantName(orderDetail) }}</b>
                <span class="dim tiny">{{ orderMerchantPhone(orderDetail) || '商家未留电话' }}</span>
              </div>
              <button v-if="orderDetail.merchantId" class="btn btn-ghost btn-xs"
                      @click="openChat(orderDetail.merchantId, orderMerchantName(orderDetail))">联系客服</button>
            </div>
            <div v-if="orderDetail.merchantId" class="row gap mt10">
              <button class="btn btn-ghost btn-xs"
                      @click="openMerchant(orderDetail.merchantId, { name: orderMerchantName(orderDetail) })">逛商家主页</button>
              <a class="dim tiny" @click="openReports({ merchantId: orderDetail.merchantId, merchantName: orderMerchantName(orderDetail) })">举报商家</a>
            </div>
          </div>

          <!-- 拒绝原因与买家决策：同意则关单，不同意进入协商 -->
          <div v-if="orderDetail.rejectStatus === 'waiting_buyer'" class="card reject-card">
            <div class="card-title"><i class="warn"></i>商家申请关闭订单</div>
            <p class="para small">拒绝原因：{{ orderDetail.rejectReason || '商家未填写原因' }}</p>
            <p class="dim tiny">同意后订单会关闭并回滚库存；不同意则进入协商，商家会继续与你沟通。</p>
            <textarea class="input textarea mt10" v-model.trim="rejectFeedback" maxlength="200"
                      placeholder="填写你的意见（选填，不同意时建议写清楚）"></textarea>
            <div class="row gap mt10">
              <button class="btn btn-ghost btn-sm" :disabled="buyerDeciding" @click="decideOrder(true)">同意关闭订单</button>
              <button class="btn btn-sm" :disabled="buyerDeciding" @click="decideOrder(false)">不同意，继续协商</button>
            </div>
          </div>
          <div v-else-if="orderDetail.rejectReason" class="card">
            <div class="card-title"><i class="warn"></i>商家拒绝记录</div>
            <p class="para small">{{ orderDetail.rejectReason }}</p>
            <p v-if="orderDetail.buyerFeedback" class="para small">我的意见：{{ orderDetail.buyerFeedback }}</p>
          </div>

          <!-- 物流：实物商品才有；小车按 progress 前进，下面是节点时间轴 -->
          <div v-if="isGoodsOrder(orderDetail)" class="card">
            <div class="card-title"><i></i>物流信息</div>
            <template v-if="logistics && logistics.nodes.length">
              <div class="logi-head">
                <b>{{ logistics.company || '快递' }}<template v-if="logistics.trackingNo"> · {{ logistics.trackingNo }}</template></b>
                <span class="tag tag-info">{{ logistics.statusText || '运输中' }}</span>
              </div>
              <div class="truck-line">
                <div class="truck-track"><i :style="{ width: truckWidth }"></i></div>
                <div class="truck-run" :style="{ left: truckLeft }">
                  <svg class="truck-ico" viewBox="0 0 34 26" aria-hidden="true">
                    <rect x="2" y="7" width="17" height="11" rx="2" fill="currentColor" opacity=".16"></rect>
                    <path d="M2 7h17v11H2z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
                    <path d="M19 10h6l4 4v4h-10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                    <circle cx="8" cy="19" r="2.4" fill="#fff" stroke="currentColor" stroke-width="1.6"></circle>
                    <circle cx="24" cy="19" r="2.4" fill="#fff" stroke="currentColor" stroke-width="1.6"></circle>
                  </svg>
                </div>
                <div class="truck-stops">
                  <span v-for="(s, i) in logistics.stops" :key="s" :class="{ on: i <= logistics.progress }">{{ s }}</span>
                </div>
              </div>
              <div class="logi-list">
                <div class="logi-node" v-for="(n, i) in logistics.nodes" :key="i" :class="{ done: n.done }">
                  <div class="logi-dot"></div>
                  <div class="logi-body"><b>{{ n.text }}</b><span>{{ n.time || '时间待更新' }}</span></div>
                </div>
              </div>
              <p class="dim tiny mt6">物流信息以快递公司实际揽收记录为准。</p>
            </template>
            <div v-else class="dim small">
              {{ orderDetail.status === 'shipped' ? '商家已标记发货，物流轨迹稍后同步。' : '商家发货后，这里会显示快递公司与运输轨迹。' }}
            </div>
          </div>

          <!-- 预约类订单没有物流，展示预约状态与预约信息 -->
          <div v-else class="card">
            <div class="card-title"><i></i>预约信息</div>
            <div class="book-rows">
              <div v-if="orderDetail.bookDate"><span>{{ orderDetail.category === 'homestay' ? '入住日期' : '预约日期' }}</span><b>{{ orderDetail.bookDate }}</b></div>
              <div v-if="orderDetail.checkOutDate"><span>离店日期</span><b>{{ orderDetail.checkOutDate }}</b></div>
              <div v-if="orderDetail.bookingSlot"><span>场次 / 时段</span><b>{{ orderDetail.bookingSlot }}</b></div>
              <div v-if="orderDetail.roomType"><span>房型</span><b>{{ orderDetail.roomType }}</b></div>
              <div v-if="orderDetail.people"><span>人数</span><b>{{ orderDetail.people }} 人</b></div>
              <div><span>预约状态</span><b>{{ statusText(orderDetail.status) }}</b></div>
            </div>
            <p class="dim tiny mt10">预约类订单由商家确认，确认后按预约时间到村体验；如需改期请先联系商家。</p>
          </div>

          <div v-if="orderDetail.address" class="card">
            <div class="card-title"><i></i>收货地址</div>
            <p class="para">{{ orderDetail.address }}</p>
          </div>

          <div v-if="orderDetail.remark" class="card">
            <div class="card-title"><i></i>备注</div>
            <p class="para">{{ orderDetail.remark }}</p>
          </div>

          <!-- 协商与操作留痕（后端 orderLogs） -->
          <div v-if="orderLogs.length" class="card">
            <div class="card-title"><i></i>协商与处理记录</div>
            <div class="log-row" v-for="(l, i) in orderLogs" :key="i">
              <span class="log-dot"></span>
              <div class="log-body">
                <b>{{ l.actionText || l.action || '处理记录' }}</b>
                <p class="small dim">{{ l.content || l.remark || '' }}</p>
                <span class="dim tiny">{{ time(l.createdAt) }} · {{ roleText(l.role) }}</span>
              </div>
            </div>
          </div>

          <!-- 结算信息：买家确认收货后才有 -->
          <div v-if="orderDetail.settlement" class="card">
            <div class="card-title"><i class="ok"></i>货款结算</div>
            <div class="book-rows">
              <div><span>结算金额</span><b class="ok">{{ money(orderDetail.settlement.amount) }}</b></div>
              <div><span>结算时间</span><b>{{ time(orderDetail.settlement.settledAt) }}</b></div>
              <div v-if="orderDetail.settlement.refunded"><span>退款冲减</span>
                <b class="warn">{{ money(orderDetail.settlement.reverseAmount) }} · {{ time(orderDetail.settlement.reverseAt) }}</b></div>
            </div>
            <p class="dim tiny mt10">确认收货后货款结算给商家；如发生退款，结算金额会同步冲减。</p>
          </div>

          <!-- 买家确认收货 / 确认完成：订单完成与货款结算的唯一入口 -->
          <template v-if="canReceive(orderDetail)">
            <button class="btn btn-block" :disabled="receiving" @click="receiveOrder">
              {{ receiving ? '确认中…' : (orderDetail.status === 'shipped' ? '确认收货' : '确认完成') }}</button>
            <p class="dim tiny" style="text-align:center;padding:8px 0">确认后订单完成，货款将结算给商家。</p>
          </template>

          <button v-if="canCancel(orderDetail) && orderDetail.rejectStatus !== 'waiting_buyer'" class="btn btn-ghost btn-block" @click="cancelOrder(orderDetail)">取消订单</button>
          <p class="dim tiny" style="text-align:center;padding:12px 0">订单是交易凭证，取消后仍会保留记录。</p>
        </div>
        <div class="page-bottom-space"></div>
      </section>

      <!-- 预约页 -->
      <section v-if="view === 'booking'" class="page-body subpage">
        <div class="topbar">
          <button class="topbar-back" @click="goBack"><svg class="ico"><use :href="iconHref('i-arrow-left')"></use></svg></button>
          <div class="topbar-title"><h1>研学 · 民宿 · 农事预约</h1><p>提前一天预约，到村直接体验</p></div>
        </div>
        <div class="tabs tabs-pad">
          <div class="tab" v-for="c in bookingCats" :key="c.key" :class="{ on: bookingCat === c.key }"
               @click="bookingCat = c.key; loadBooking()">{{ c.text }}</div>
        </div>
        <div class="pad-x">
          <div v-if="loadingBooking" class="empty-box"><b>正在加载…</b></div>
          <div v-else-if="!bookingList.length" class="empty-box"><b>这个分类暂时没有可预约项目</b></div>
          <div v-else class="card booking-card" v-for="p in bookingList" :key="p.id">
            <img :src="cover(p.cover, p.category)" :alt="p.name" loading="lazy" @click="openProduct(p.id)" @error="imgFail">
            <div class="booking-body">

          </div>

        </div>
        <div class="tabbar-item" :class="{ on: view === 'mine' }" @click="go('mine', true)">
          <svg class="ico tabbar-ico"><use :href="iconHref('i-user')"></use></svg><em>我的</em>
        </div>
      </nav>
    </div>

    <!-- ==================================================================
         购物车抽屉（全局，商城与商品详情都能唤起）
         ================================================================== -->
    <div v-if="cartOpen" class="mask" @click="cartOpen = false"></div>
    <div class="drawer" :class="{ open: cartOpen }">
      <div class="drawer-head">
        <b>购物车（{{ cartCount }} 件）</b>
        <a class="danger" @click="clearCart">清空</a>
      </div>
      <div class="drawer-body">
        <div v-if="!cart.length" class="empty-box"><b>购物车还是空的</b><p>挑几件战旗村的好物吧。</p></div>
        <div class="line-item" v-for="it in cart" :key="it.productId">
          <img :src="cover(it.cover, it.category)" :alt="it.name" @error="imgFail">
          <div class="line-body">
            <b class="ell1">{{ it.name }}</b>
            <span class="price tiny">{{ money(it.price) }} / {{ it.unit }}</span>
            <div class="row-between mt6">
              <div class="stepper">
                <button @click="setQty(it.productId, it.qty - 1)">−</button><b>{{ it.qty }}</b>
                <button @click="setQty(it.productId, it.qty + 1)">＋</button>
              </div>
              <a class="dim tiny" @click="removeCart(it.productId)">删除</a>
            </div>
          </div>
        </div>
      </div>
      <div class="drawer-foot">
        <div class="bottom-total"><span>合计</span><b>{{ money(cartTotal) }}</b></div>
        <button class="btn" :disabled="!cart.length" @click="startCheckout">去结算</button>
      </div>
    </div>
  </template>
</div>

<script src="../vendors/vue.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/speech.js"></script>
<script src="../assets/js/spot-icons.js"></script>
<script src="../assets/js/profile.js"></script>
<script src="../assets/js/virtual-map.js"></script>
<script src="./js/visitor.js"></script>
</body>
</html>
