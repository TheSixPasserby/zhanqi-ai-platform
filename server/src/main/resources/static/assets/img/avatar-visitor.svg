<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!--
    游客端默认头像 · 「斗笠与竹影」
    不出现任何文字：一顶川西竹编斗笠压在浅浅的田垄上，右侧两片竹叶。
    注册后未上传照片时，游客端各界面都用这张。
  -->
  <defs>
    <linearGradient id="vaBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#F2E2C6"/>
    </linearGradient>
    <linearGradient id="vaHat" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E8BC76"/>
      <stop offset="1" stop-color="#C08B44"/>
    </linearGradient>
    <linearGradient id="vaField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FCCA9"/>
      <stop offset="1" stop-color="#5FAE85"/>
    </linearGradient>
    <clipPath id="vaClip"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>

  <g clip-path="url(#vaClip)">
    <rect width="160" height="160" fill="url(#vaBg)"/>
    <circle cx="118" cy="40" r="30" fill="#F7C873" opacity="0.28"/>

    <!-- 田垄 -->
    <path d="M-6 118c24-12 47-12 71 0s47 12 71 0c10-5 19-7 28-7V166H-6z" fill="url(#vaField)" opacity="0.35"/>
    <path d="M-6 130c24-10 47-10 71 0s47 10 71 0c10-4 19-6 28-6V166H-6z" fill="url(#vaField)" opacity="0.6"/>
    <path d="M-6 143c24-8 47-8 71 0s47 8 71 0c10-3 19-5 28-5V166H-6z" fill="url(#vaField)" opacity="0.85"/>

    <!-- 斗笠 -->
    <path d="M80 44c-3.6 0-6.8 1.9-9 5.2L45.4 88c-2.2 3.3-.3 7.6 3.8 7.6h61.6c4.1 0 6-4.3 3.8-7.6L89 49.2c-2.2-3.3-5.4-5.2-9-5.2z" fill="url(#vaHat)"/>
    <path d="M80 50.5c-2.6 0-4.8 1.4-6.3 3.8L52 88h56L86.3 54.3c-1.5-2.4-3.7-3.8-6.3-3.8z" fill="#F0CB8D" opacity="0.5"/>
    <path d="M80 44v-6" stroke="#A9752F" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="80" cy="35" r="4.2" fill="#A9752F"/>
    <!-- 帽檐 -->
    <ellipse cx="80" cy="94" rx="47" ry="9.6" fill="#B57F38"/>
    <ellipse cx="80" cy="92" rx="47" ry="9" fill="#E3B674"/>
    <path d="M40 91.4c14 3.6 66 3.6 80 0" fill="none" stroke="#C79046" stroke-width="1.6" opacity="0.6"/>

    <!-- 竹叶 -->
    <path d="M120 104c12-10 24-13 33-9-9 10-21 14-33 9z" fill="#4E9C74"/>
    <path d="M118 116c11-4 21-2 28 5-11 5-21 3-28-5z" fill="#3F8A63"/>
    <path d="M121 110c-2-9-1-16 2-22 4 8 3 16-2 22z" fill="#3F8A63" opacity="0.8"/>
  </g>
</svg>
